
name: Build C++ Native Proxy (.so)

on:
  push:
  workflow_dispatch:

jobs:
  build-native:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download Android NDK
        run: |
          wget -q https://dl.google.com/android/repository/android-ndk-r26b-linux.zip
          unzip -q android-ndk-r26b-linux.zip
          echo "NDK_HOME=$PWD/android-ndk-r26b" >> $GITHUB_ENV

      - name: Locate CMakeLists.txt
        id: findcmake
        run: |
          CMAKE_DIR=$(dirname "$(find . -name 'CMakeLists.txt' | head -n 1)")
          echo "Found CMakeLists.txt in: $CMAKE_DIR"
          echo "cmake_dir=$CMAKE_DIR" >> "$GITHUB_OUTPUT"

      - name: Configure
        run: |
          cmake -S "${{ steps.findcmake.outputs.cmake_dir }}" -B build \
            -DCMAKE_TOOLCHAIN_FILE=$NDK_HOME/build/cmake/android.toolchain.cmake \
            -DANDROID_ABI=arm64-v8a \
            -DANDROID_PLATFORM=android-21 \
            -DCMAKE_BUILD_TYPE=Release \
            -GNinja

      - name: Build
        run: cmake --build build --config Release

      - name: Show output
        run: find build -name "*.so"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: libnative_proxy-arm64-v8a
          path: build/**/libnative_proxy.so
